#Application
spring.application.name=config-service
server.port=${SERVER_PORT:8880}
#Git config-hub
spring.cloud.config.server.git.uri=${GIT_URI:https://github.com/gfreee333/Banking-Config.git}
spring.cloud.config.server.git.default-label=${GIT_LABEL:main}
spring.cloud.config.server.git.search-paths=${GIT_SEARCH_PATHS:{application}}
#Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka123@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:config-service}
#Security
spring.security.user.name=${CONFIG_USERNAME:config}
spring.security.user.password=${CONFIG_PASSWORD:config123}
#Actuator
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,refresh,busrefresh}
management.endpoint.health.show-details=${ACTUATOR_SHOW_DETAILS:always}
#Logging
logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.config=DEBUG
logging.level.org.springframework.cloud.bus=DEBUG
#Kafka for bus
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:config-server-group}
spring.kafka.consumer.auto-offset-reset=earliest
#Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
#Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
